# ПРИМЕР security-стадии GitLab CI для комплекта модуля B (REPORT.md, раздел 2.2).
# СТАТУС: в реальном GitLab НЕ запускался. Проверено локально (evidence/verification/ci-check.log):
#   разбор YAML, схема GitLab CI (SchemaStore), команды каждого задания и их коды выхода
#   на тех же версиях инструментов. Работа runner'а, образов Docker и приёма отчётов GitLab не проверялась.
#
# Все команды выполняются из корня репозитория (= корень сдаваемого комплекта, $CI_PROJECT_DIR):
#   анализируемый код — microservice/, зависимости — microservice/requirements.txt.
#
# Блокирующие gate (задание падает -> pipeline не проходит):
#   sast-semgrep-gate   — находки Semgrep уровня ERROR (в т.ч. кастомные правила для docker-compose);
#   sca-pip-audit       — любая известная уязвимость в зависимостях (pip-audit не умеет фильтровать по CVSS);
#   secrets-gitleaks    — найденные секреты;
#   iac-trivy           — High/Critical в Dockerfile/K8s/Terraform. ВНИМАНИЕ: docker-compose Trivy не разбирает
#                         (локально: "Detected config files num=0"), compose покрывают правила Semgrep bank.compose-*.
# JSON-артефакты сохраняются всегда (artifacts:when: always), в т.ч. при падении задания.

stages:
  - scan
  - gate
  - report

variables:
  SEMGREP_VERSION: "1.186.0"
  SEMGREP_RULES_SHA: "a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2"   # зашит также в tools/run_semgrep.sh
  PIP_AUDIT_VERSION: "2.10.1"
  PYTHON_IMAGE: "python:3.12"          # в проде — закрепить по @sha256
  GITLEAKS_IMAGE: "zricethezav/gitleaks:v8.21.2"
  TRIVY_IMAGE: "aquasec/trivy:0.76.2"

# ---------------------------------------------------------------- SAST
# Отчёт и gate разделены: GitLab принимает находки из artifacts:reports:sarif только
# у успешно завершившегося задания, поэтому задание с отчётом не должно падать.
sast-semgrep-report:
  stage: scan
  image: $PYTHON_IMAGE
  before_script:
    - pip install --quiet "semgrep==${SEMGREP_VERSION}" "setuptools<81"
  script:
    - bash tools/run_semgrep.sh semgrep.json semgrep.sarif
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - semgrep.json      # исходный Semgrep JSON для независимого анализа / DefectDojo
      - semgrep.sarif
    reports:
      # SARIF 2.1.0. Тариф Ultimate; GitLab 18.11-19.1 — за feature flag sarif_ingestion,
      # GA с GitLab 19.2. Для более ранних версий/тарифов см. альтернативу ниже.
      sarif: semgrep.sarif

sast-semgrep-gate:
  stage: gate
  image: $PYTHON_IMAGE
  needs:
    - job: sast-semgrep-report
      artifacts: true
  script:
    - python3 tools/semgrep_gate.py semgrep.json ERROR

# Альтернатива для GitLab без приёма SARIF: штатный SAST-шаблон GitLab, который сам формирует
# gl-sast-report.json по схеме GitLab Security Report и публикует его через artifacts:reports:sast.
# Кастомные правила в нём подключаются через SAST ruleset (.gitlab/sast-ruleset.toml). Не проверялось.
# include:
#   - template: Jobs/SAST.gitlab-ci.yml

# ---------------------------------------------------------------- SCA
sca-pip-audit:
  stage: scan
  image: $PYTHON_IMAGE
  before_script:
    - pip install --quiet "pip-audit==${PIP_AUDIT_VERSION}"
  script:
    # Одна команда и пишет JSON, и возвращает 1 при найденных уязвимостях — gate не теряется.
    - pip-audit -r microservice/requirements.txt --format json --output pip-audit.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - pip-audit.json

# ---------------------------------------------------------------- Secrets
secrets-gitleaks:
  stage: scan
  image:
    name: $GITLEAKS_IMAGE
    entrypoint: [""]          # у образа ENTRYPOINT=gitleaks, без сброса script не выполнится
  variables:
    GIT_DEPTH: "0"            # полная история, а не shallow clone
  script:
    - gitleaks git --report-format json --report-path gitleaks.json .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - gitleaks.json

# ---------------------------------------------------------------- IaC
iac-trivy:
  stage: scan
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]          # у образа ENTRYPOINT=trivy
  script:
    - >-
      trivy config
      --severity HIGH,CRITICAL
      --exit-code 1
      --format json
      --output trivy-config.json
      microservice
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - trivy-config.json

# ---------------------------------------------------------------- Vulnerability management
# Импорт результатов в DefectDojo (дедупликация, триаж, SLA). Выполняется и при падении gate.
# DD_URL, DD_API_TOKEN (masked), DD_ENGAGEMENT_ID — переменные CI/CD проекта. Не проверялось.
upload-defectdojo:
  stage: report
  image:
    name: curlimages/curl:8.11.1
    entrypoint: [""]
  allow_failure: true
  needs:
    - job: sast-semgrep-report
      artifacts: true
    - job: sca-pip-audit
      artifacts: true
    - job: secrets-gitleaks
      artifacts: true
    - job: iac-trivy
      artifacts: true
  rules:
    - if: $DD_URL && $DD_API_TOKEN
      when: always            # с rules job-level `when` недопустим, поэтому when задан внутри правила
  script:
    - |
      set -eu
      upload() {  # $1 — файл, $2 — scan_type DefectDojo
        [ -s "$1" ] || { echo "skip: $1 отсутствует"; return 0; }
        curl --fail-with-body -sS \
          -H "Authorization: Token ${DD_API_TOKEN}" \
          -F "engagement=${DD_ENGAGEMENT_ID}" \
          -F "scan_type=$2" \
          -F "close_old_findings=true" \
          -F "file=@$1" \
          "${DD_URL}/api/v2/reimport-scan/"
      }
      upload semgrep.json      "Semgrep JSON Report"
      upload pip-audit.json    "pip-audit Scan"
      upload gitleaks.json     "Gitleaks Scan"
      upload trivy-config.json "Trivy Scan"
